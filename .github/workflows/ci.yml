name: CI — BackOffice

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run linter
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Vite (staging config)
        run: npm run build
        env:
          VITE_API_URL: /staging-api/api
          VITE_BASE_PATH: /staging/

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image for scanning
        run: |
          docker build \
            --build-arg VITE_API_URL=/staging-api/api \
            --build-arg VITE_BASE_PATH=/staging/ \
            -t cesizen-backoffice:scan .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cesizen-backoffice:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine environment + chemins
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "api_url=/api" >> $GITHUB_OUTPUT
            echo "base_path=/" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "api_url=/staging-api/api" >> $GITHUB_OUTPUT
            echo "base_path=/staging/" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ steps.env.outputs.api_url }}
            VITE_BASE_PATH=${{ steps.env.outputs.base_path }}
          tags: |
            ghcr.io/langbapt/cesizen-backoffice:${{ steps.env.outputs.tag }}
            ghcr.io/langbapt/cesizen-backoffice:sha-${{ github.sha }}

      - name: Trigger deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: LangBapt/cesizen-deploy
          event-type: deploy-${{ steps.env.outputs.env }}